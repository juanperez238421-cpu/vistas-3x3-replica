name: Apply UI v2 patch once

on:
  push:
    branches:
      - qa/diedric-ui-v2-20260908
    paths:
      - .github/workflows/apply-ui-v2-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: qa/diedric-ui-v2-20260908
          fetch-depth: 0

      - name: Apply surgical HTML and runtime optimizations
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          index_path = Path("index.html")
          index = index_path.read_text(encoding="utf-8")
          index = replace_once(
              index,
              '<meta name="viewport" content="width=device-width, initial-scale=1" />',
              '<meta name="viewport" content="width=device-width, initial-scale=1" />\n    <meta name="description" content="Biblioteca interactiva de figuras 3x3 para practicar alzado, planta y vistas laterales del sistema diédrico." />\n    <meta name="theme-color" content="#ffffff" />',
              "meta",
          )
          index = replace_once(
              index,
              '<link rel="stylesheet" href="./styles.css" />',
              '<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />\n    <link rel="stylesheet" href="./styles.css" />\n    <link rel="stylesheet" href="./ui-enhancements.css" />',
              "styles",
          )
          index = replace_once(
              index,
              '<body>\n    <main class="app-shell">',
              '<body>\n    <a class="skip-link" href="#three-stage">Saltar al visor 3D</a>\n    <main class="app-shell" id="main-content">',
              "skip-link",
          )
          index = index.replace('<p class="kicker">Libreria</p>', '<p class="kicker">Librería</p>')
          index = index.replace('>\n                  Basico\n', '>\n                  Básico\n')
          index = index.replace('<strong id="current-view-label">Isometrica</strong>', '<strong id="current-view-label">Isométrica</strong>')
          index = replace_once(
              index,
              '<script type="module" src="./app.js"></script>',
              '<script type="module" src="./app.js"></script>\n    <script type="module" src="./ui-enhancements.js"></script>',
              "enhancement-script",
          )
          index_path.write_text(index, encoding="utf-8")

          app_path = Path("app.js")
          app = app_path.read_text(encoding="utf-8")
          app = app.replace('label: "Isometrica",', 'label: "Isométrica",', 1)
          app = app.replace('if (value === "basico") return "Basico";', 'if (value === "basico") return "Básico";', 1)
          app = replace_once(
              app,
              'let viewerFrame = 0;',
              'let viewerFrame = 0;\nlet viewerDirty = true;',
              "viewer-dirty-state",
          )
          app = replace_once(
              app,
              '''async function preloadAllSolutions() {\n  for (const piece of PIECES) {\n    if (solutionCache.has(piece.id)) {''',
              '''function waitForIdleWork() {\n  return new Promise((resolve) => {\n    if ("requestIdleCallback" in window) {\n      window.requestIdleCallback(() => resolve(), { timeout: 700 });\n      return;\n    }\n    window.setTimeout(resolve, 32);\n  });\n}\n\nasync function preloadAllSolutions() {\n  if (navigator.connection?.saveData) {\n    return;\n  }\n\n  for (const piece of PIECES) {\n    await waitForIdleWork();\n\n    if (solutionCache.has(piece.id)) {''',
              "idle-preload",
          )
          app = replace_once(
              app,
              '''function animateViewer() {\n  viewerFrame = window.requestAnimationFrame(animateViewer);\n  controls?.update();\n  renderThree();\n}''',
              '''function invalidateViewer() {\n  viewerDirty = true;\n}\n\nfunction animateViewer() {\n  viewerFrame = window.requestAnimationFrame(animateViewer);\n  if (document.hidden) {\n    return;\n  }\n\n  const controlsChanged = controls?.update() ?? false;\n  if (!viewerDirty && !controlsChanged) {\n    return;\n  }\n\n  renderThree();\n  viewerDirty = false;\n}''',
              "render-on-change",
          )
          app = replace_once(
              app,
              '''  const intersection = pickPieceFace(event);\n  setHighlightFromIntersection(hoverFaceMesh, intersection);\n}\n\nfunction handleViewerPointerUp''',
              '''  const intersection = pickPieceFace(event);\n  setHighlightFromIntersection(hoverFaceMesh, intersection);\n  invalidateViewer();\n}\n\nfunction handleViewerPointerUp''',
              "hover-invalidate",
          )
          app = replace_once(
              app,
              '''  state.viewer.pointerDown = null;\n  state.viewer.dragDistance = 0;\n}\n\nfunction handleViewerPointerLeave() {\n  clearHighlight(hoverFaceMesh);\n  state.viewer.pointerDown = null;\n  state.viewer.dragDistance = 0;\n}''',
              '''  state.viewer.pointerDown = null;\n  state.viewer.dragDistance = 0;\n  invalidateViewer();\n}\n\nfunction handleViewerPointerLeave() {\n  clearHighlight(hoverFaceMesh);\n  state.viewer.pointerDown = null;\n  state.viewer.dragDistance = 0;\n  invalidateViewer();\n}''',
              "selection-invalidate",
          )
          app = replace_once(
              app,
              '''  refreshViewerUi();\n  renderSolutionOverlay();\n}\n\nfunction renderThree()''',
              '''  refreshViewerUi();\n  renderSolutionOverlay();\n  invalidateViewer();\n}\n\nfunction renderThree()''',
              "color-invalidate",
          )
          app = replace_once(
              app,
              '''  renderer = new THREE.WebGLRenderer({\n    antialias: true,\n    alpha: false,\n    preserveDrawingBuffer: true,\n  });\n  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));''',
              '''  renderer = new THREE.WebGLRenderer({\n    antialias: true,\n    alpha: false,\n    preserveDrawingBuffer: true,\n  });\n  const pixelRatioCap = window.matchMedia("(max-width: 900px)").matches ? 1.5 : 2;\n  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, pixelRatioCap));''',
              "pixel-ratio-cap",
          )
          app = replace_once(
              app,
              '''  /* Avoid observing the panels themselves: canvas resizing against a padded/content-driven parent caused a feedback loop. */\n  window.addEventListener("resize", requestLayoutResize);''',
              '''  document.addEventListener("visibilitychange", () => {\n    if (!document.hidden) {\n      invalidateViewer();\n      requestLayoutResize();\n    }\n  });\n\n  /* Avoid observing the panels themselves: canvas resizing against a padded/content-driven parent caused a feedback loop. */\n  window.addEventListener("resize", requestLayoutResize);''',
              "visibility-resume",
          )
          app_path.write_text(app, encoding="utf-8")
          PY

      - name: Remove one-time patch workflow
        run: rm .github/workflows/apply-ui-v2-once.yml

      - name: Commit optimized page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js .github/workflows/apply-ui-v2-once.yml
          git commit -m "ui: wire QA layer and optimize viewer runtime"
          git push origin HEAD:qa/diedric-ui-v2-20260908
